name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          mkdir proj && unzip -q AzadChat.zip -d proj
          S=$(find proj -name settings.gradle.kts | head -1)
          echo "D=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
        working-directory: ${{ env.D }}
      - uses: actions/upload-artifact@v4
        with:
          name: AzadChat-apk
          path: ${{ env.D }}/app/build/outputs/apk/debug/*.apk
