name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          set -e
          mkdir -p proj && cd proj
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'AZEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AzadChat"
          include(":app")
          AZEOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'AZEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          AZEOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'AZEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          AZEOF
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'AZEOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.azadchat.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.azadchat.app"; minSdk = 24; targetSdk = 34; versionCode = 1157; versionName = "1.15.7" }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.biometric:biometric:1.1.0")
          }
          AZEOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'AZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="AzadChat" android:icon="@android:drawable/sym_def_app_icon" android:theme="@style/Theme.AzadChat"
                  android:usesCleartextTraffic="false" android:allowBackup="false" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:windowSoftInputMode="adjustResize">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          AZEOF
          mkdir -p "$(dirname app/src/main/res/values/themes.xml)"
          cat > app/src/main/res/values/themes.xml <<'AZEOF'
          <resources>
              <style name="Theme.AzadChat" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#020716</item>
                  <item name="android:statusBarColor">#020716</item>
                  <item name="android:navigationBarColor">#020716</item>
              </style>
          </resources>
          AZEOF
          mkdir -p "$(dirname app/src/main/java/com/azadchat/app/MainActivity.kt)"
          cat > app/src/main/java/com/azadchat/app/MainActivity.kt <<'AZEOF'
          package com.azadchat.app
          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.DownloadManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.os.Environment
          import android.webkit.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          class MainActivity : AppCompatActivity() {
              companion object { const val START_URL = "https://azadchat.gt.tc/" }
              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var pendingPerm: PermissionRequest? = null
              private val pickFile = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val data = r.data
                  val res: Array<Uri>? = if (r.resultCode == RESULT_OK && data != null) {
                      val clip = data.clipData
                      if (clip != null) Array(clip.itemCount) { clip.getItemAt(it).uri } else data.data?.let { arrayOf(it) }
                  } else null
                  fileCb?.onReceiveValue(res); fileCb = null
              }
              private val askPerms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  pendingPerm?.let { p -> p.grant(p.resources) }; pendingPerm = null
              }
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this); setContentView(web)
                  web.settings.apply {
                      javaScriptEnabled = true; domStorageEnabled = true; mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false; allowContentAccess = true
                  }
                  CookieManager.getInstance().apply { setAcceptCookie(true); setAcceptThirdPartyCookies(web, false) }
                  web.addJavascriptInterface(AzadBiometricBridge(this, web), "AzadNative")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, req: WebResourceRequest): Boolean {
                          val u = req.url
                          if (u.host == Uri.parse(START_URL).host) return false
                          startActivity(Intent(Intent.ACTION_VIEW, u)); return true
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams): Boolean {
                          fileCb?.onReceiveValue(null); fileCb = cb
                          return try { pickFile.launch(p.createIntent()); true } catch (e: Exception) { fileCb = null; false }
                      }
                      override fun onPermissionRequest(req: PermissionRequest) {
                          runOnUiThread {
                              val need = mutableListOf<String>()
                              if (req.resources.contains(PermissionRequest.RESOURCE_AUDIO_CAPTURE)) need += Manifest.permission.RECORD_AUDIO
                              if (req.resources.contains(PermissionRequest.RESOURCE_VIDEO_CAPTURE)) need += Manifest.permission.CAMERA
                              val missing = need.filter { ContextCompat.checkSelfPermission(this@MainActivity, it) != PackageManager.PERMISSION_GRANTED }
                              if (missing.isEmpty()) req.grant(req.resources) else { pendingPerm = req; askPerms.launch(missing.toTypedArray()) }
                          }
                      }
                  }
                  web.setDownloadListener { url, ua, cd, mime, _ ->
                      val r = DownloadManager.Request(Uri.parse(url)).apply {
                          setMimeType(mime); addRequestHeader("Cookie", CookieManager.getInstance().getCookie(url) ?: ""); addRequestHeader("User-Agent", ua)
                          setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                          setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, URLUtil.guessFileName(url, cd, mime))
                      }
                      (getSystemService(DOWNLOAD_SERVICE) as DownloadManager).enqueue(r)
                  }
                  if (savedInstanceState == null) web.loadUrl(START_URL) else web.restoreState(savedInstanceState)
                  if (android.os.Build.VERSION.SDK_INT >= 33) ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
              }
              override fun onSaveInstanceState(o: Bundle) { super.onSaveInstanceState(o); web.saveState(o) }
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (web.canGoBack()) web.goBack() else super.onBackPressed() }
          }
          AZEOF
          mkdir -p "$(dirname app/src/main/java/com/azadchat/app/AzadBiometricBridge.kt)"
          cat > app/src/main/java/com/azadchat/app/AzadBiometricBridge.kt <<'AZEOF'
          package com.azadchat.app
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyPermanentlyInvalidatedException
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricManager.Authenticators.BIOMETRIC_STRONG
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import org.json.JSONObject
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.PrivateKey
          import java.security.Signature
          import java.security.spec.ECGenParameterSpec
          class AzadBiometricBridge(private val activity: FragmentActivity, private val web: WebView) {
              private val ks: KeyStore = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
              private fun alias(keyId: String) = "azad_bio_$keyId"
              private fun b64u(b: ByteArray) = Base64.encodeToString(b, Base64.URL_SAFE or Base64.NO_WRAP or Base64.NO_PADDING)
              @JavascriptInterface
              fun bioAvailable(): String = when (BiometricManager.from(activity).canAuthenticate(BIOMETRIC_STRONG)) {
                  BiometricManager.BIOMETRIC_SUCCESS -> "ok"
                  BiometricManager.BIOMETRIC_ERROR_NONE_ENROLLED -> "none"
                  BiometricManager.BIOMETRIC_ERROR_NO_HARDWARE, BiometricManager.BIOMETRIC_ERROR_HW_UNAVAILABLE -> "nohw"
                  else -> "unsupported"
              }
              @JavascriptInterface
              fun bio(reqId: String, op: String, keyId: String, payload: String, title: String) {
                  activity.runOnUiThread {
                      try {
                          val sig = Signature.getInstance("SHA256withECDSA")
                          var pubKey: ByteArray? = null
                          if (op == "enroll") {
                              if (ks.containsAlias(alias(keyId))) ks.deleteEntry(alias(keyId))
                              val b = KeyGenParameterSpec.Builder(alias(keyId), KeyProperties.PURPOSE_SIGN)
                                  .setAlgorithmParameterSpec(ECGenParameterSpec("secp256r1"))
                                  .setDigests(KeyProperties.DIGEST_SHA256)
                                  .setUserAuthenticationRequired(true)
                                  .setInvalidatedByBiometricEnrollment(true)
                              if (android.os.Build.VERSION.SDK_INT >= 30)
                                  b.setUserAuthenticationParameters(0, KeyProperties.AUTH_BIOMETRIC_STRONG)
                              val kpg = KeyPairGenerator.getInstance(KeyProperties.KEY_ALGORITHM_EC, "AndroidKeyStore")
                              kpg.initialize(b.build()); pubKey = kpg.generateKeyPair().public.encoded
                          }
                          val pk = ks.getKey(alias(keyId), null) as? PrivateKey
                              ?: return@runOnUiThread reply(reqId, false, err("nokey"))
                          sig.initSign(pk)
                          val info = BiometricPrompt.PromptInfo.Builder()
                              .setTitle(title).setSubtitle("با اثر انگشت تأیید کن")
                              .setNegativeButtonText("لغو").setAllowedAuthenticators(BIOMETRIC_STRONG).setConfirmationRequired(false).build()
                          val prompt = BiometricPrompt(activity, ContextCompat.getMainExecutor(activity), object : BiometricPrompt.AuthenticationCallback() {
                              override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) {
                                  try {
                                      val s = r.cryptoObject!!.signature!!
                                      s.update(payload.toByteArray(Charsets.UTF_8))
                                      val o = JSONObject().put("keyId", keyId).put("signature", b64u(s.sign()))
                                      if (pubKey != null) o.put("publicKey", b64u(pubKey))
                                      reply(reqId, true, o.toString())
                                  } catch (e: Exception) { reply(reqId, false, err("cancel")) }
                              }
                              override fun onAuthenticationError(code: Int, msg: CharSequence) {
                                  if (op == "enroll") ks.deleteEntry(alias(keyId))
                                  val lock = code == BiometricPrompt.ERROR_LOCKOUT || code == BiometricPrompt.ERROR_LOCKOUT_PERMANENT
                                  reply(reqId, false, err(if (lock) "lockout" else "cancel"))
                              }
                          })
                          prompt.authenticate(info, BiometricPrompt.CryptoObject(sig))
                      } catch (e: KeyPermanentlyInvalidatedException) {
                          reply(reqId, false, err("invalidated"))
                      } catch (e: Exception) {
                          reply(reqId, false, err("cancel"))
                      }
                  }
              }
              private fun err(code: String) = JSONObject().put("error", code).toString()
              private fun reply(reqId: String, ok: Boolean, json: String) {
                  web.post { web.evaluateJavascript("window.__azNativeBio(${JSONObject.quote(reqId)},$ok,${JSONObject.quote(json)})", null) }
              }
          }
          AZEOF
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: AzadChat-apk
          path: proj/app/build/outputs/apk/debug/*.apk
